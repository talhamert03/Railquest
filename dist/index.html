<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#a9d9d1">
  <meta name="description" content="58 özgün ray bulmacası. Altı vagon, anahtarlı bariyerler, hassas köprüler ve canlı adalar. Telefon için tasarlanmış tatlı bir tren yolculuğu.">
  <title>Railquest — Anahtarların Yolculuğu</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./mobile-menu.css">
  <link rel="stylesheet" href="./game-layout.css">
</head>
<body>
  <div class="loading-screen" id="loading-screen" aria-label="Oyun yükleniyor"><div class="loading-layout"><img class="loading-art" src="./assets/cover.webp" alt="Küçük tren adası" width="1024" height="1024" fetchpriority="high"><div class="loading-copy"><span class="eyebrow">KÜÇÜK BİR YOLCULUK</span><h1>Railquest</h1><p id="loading-status" role="status">Adalar yolculuğa hazırlanıyor…</p><div class="loading-meter"><progress id="loading-progress" max="100" value="0" aria-label="Oyun hazırlığı"></progress><strong id="loading-percent" aria-hidden="true">0%</strong></div><button class="button button-green" id="loading-retry" hidden>Yeniden dene</button></div></div></div>
  <main id="app"></main>
  <div class="rotate-screen" id="rotate-screen" role="status"><div class="rotate-phone" aria-hidden="true"></div><h2>Yolculuğu yatay çevir.</h2><p>Railquest yatay oynanır.<br>Telefonunu veya tabletini yana çevir.</p></div>
  <noscript>Railquest’i oynamak için tarayıcında JavaScript'i etkinleştir.</noscript>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <script type="module" src="./js/boot.js"></script>
</body>
</html>
